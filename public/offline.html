<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sin conexión</title>
<style>
  :root { --bg: #F7F6F2; --text: #1B2130; --sub: #5B6272; --accent: #A6821F; --on-accent: #FFFFFF; }

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  svg { display: block; margin: 0 auto; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: var(--sub); margin: 0 0 20px; line-height: 1.5; }
  button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>

</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icono.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Seguí tu reclamo por siniestro con ATG Lex Solutions." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ATG Lex Solutions" />
    <meta property="og:title" content="Seguí tu reclamo · ATG Lex Solutions" />
    <meta property="og:description" content="Mirá cómo va tu reclamo y mandanos tu documentación desde el celular." />
    <meta property="og:image" content="https://pas-tracker20.vercel.app/og.jpg" />
    <meta property="og:image:width" content="2000" />
    <meta property="og:image:height" content="1056" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Cada parte se instala como una app distinta: estudio, portal del PAS y vista del cliente
      (function () {
        var p = location.pathname, q = new URLSearchParams(location.search);
        var m = p.indexOf("/portal") === 0 ? "manifest-portal" : (q.get("vista") === "cliente" || q.has("caso")) ? "manifest-cliente" : "manifest";
        var l = document.createElement("link");
        l.rel = "manifest"; l.href = "/" + m + ".webmanifest";
        document.head.appendChild(l);
        document.title = m === "manifest-portal" ? "Portal PAS" : m === "manifest-cliente" ? "Mi reclamo · ATG Lex Solutions" : "PAS Tracker";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <title>PAS Tracker</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo
      (function () {
        try {
          var g = localStorage.getItem("pas_tracker_dark_mode");
          var dark = g === null ? window.matchMedia("(prefers-color-scheme: dark)").matches : JSON.parse(g);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var a = localStorage.getItem("pas_tracker_acento");
          if (a) document.documentElement.dataset.accent = a;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
